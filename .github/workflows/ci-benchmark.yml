name: CI benchmark (temporary)

# Measures native build configurations on the hosted runner for the CI speed-up pull request.
# Remove this file before that pull request merges. Results are printed as notices and in the
# job summaries.

on:
  push:
    branches: [perf/ci-build-speed]
    paths: [.github/workflows/ci-benchmark.yml]

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2

jobs:
  # Builds the environment shader bundle and the Rust crate once, so every variant below times the
  # same work: the C++ build with those two inputs already cached.
  seed:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Enable long paths
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
      - name: Update submodules
        run: git submodule update --init --recursive
      - name: Enter the Visual Studio x64 developer environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $before = @{}; Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          foreach ($line in (cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set")) {
            if ($line -notmatch '^([^=]+)=(.*)$') { continue }
            $name, $value = $Matches[1], $Matches[2]
            if ($name -match '^(GITHUB_|RUNNER_)' -or $before[$name] -eq $value) { continue }
            if ($name -eq 'Path') { $added = @($value -split ';' | Where-Object { $_ -and ($before['Path'] -split ';') -notcontains $_ }); [array]::Reverse($added); $added | Out-File -Append -Encoding utf8 $env:GITHUB_PATH }
            else { "$name=$value" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV }
          }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/x64-deadlock-ninja-release/cargo
          key: cargo-ninja-${{ runner.os }}-${{ hashFiles('Lib/**/Cargo.toml', 'Lib/**/Cargo.lock', 'Cargo.lock') }}
          restore-keys: cargo-ninja-${{ runner.os }}-
      - name: Build the shader bundle and the Rust crate
        run: |
          cmake --preset x64-deadlock-ninja-release
          $timer = [Diagnostics.Stopwatch]::StartNew()
          cmake --build --preset x64-deadlock-ninja-release --parallel 4 --target EnvironmentShaderBundle cargo-build_afx_hook_source2
          "::notice title=Seed::shader bundle and cargo took $([int]$timer.Elapsed.TotalSeconds) s"
      - name: Stage the shader bundle
        run: |
          $bundle = "build\x64-deadlock-ninja-release\AfxHookSource2\Release\environment-shaders"
          New-Item -ItemType Directory -Force bench-shaders | Out-Null
          Get-Content "$bundle\manifest.txt" | Where-Object { $_ } | ForEach-Object { Copy-Item (Join-Path $bundle $_) bench-shaders }
          Copy-Item "$bundle\manifest.txt" bench-shaders
      - uses: actions/cache/save@v4
        with:
          path: bench-shaders
          key: bench-shaders-${{ github.run_id }}

  bench:
    needs: seed
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: vs-m3, rep: 1 }
          - { variant: vs-m3, rep: 2 }
          - { variant: ninja-j4, rep: 1 }
          - { variant: ninja-j4, rep: 2 }
          - { variant: ninja-j6, rep: 1 }
          - { variant: ninja-j6, rep: 2 }
          - { variant: ninja-j8, rep: 1 }
          - { variant: ninja-j8, rep: 2 }
          - { variant: sccache-cold-j4, rep: 1 }
    env:
      VARIANT: ${{ matrix.variant }}
      PRESET: ${{ startsWith(matrix.variant, 'vs-') && 'x64-deadlock-release' || 'x64-deadlock-ninja-release' }}
    steps:
      - name: Enable long paths
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
      - name: Update submodules
        run: git submodule update --init --recursive
      - name: Install sccache
        if: startsWith(matrix.variant, 'sccache')
        run: &install-sccache |
          $version = "v0.18.0"
          $sha256 = "8965c74d5e8a225244f741e18ad2f3f504f48228dc1bac948fc22761a348363d"
          $name = "sccache-$version-x86_64-pc-windows-msvc"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest "https://github.com/mozilla/sccache/releases/download/$version/$name.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $sha256) { throw "sccache download does not match its pinned SHA-256" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP $name | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "SCCACHE_DIR=$(Join-Path $env:RUNNER_TEMP 'sccache')" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "SCCACHE_CACHE_SIZE=3G" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "SCCACHE_IDLE_TIMEOUT=0" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CMAKE_C_COMPILER_LAUNCHER=sccache" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CMAKE_CXX_COMPILER_LAUNCHER=sccache" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Enter the Visual Studio x64 developer environment
        if: ${{ !startsWith(matrix.variant, 'vs-') }}
        run: &vs-env |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $before = @{}; Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          foreach ($line in (cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set")) {
            if ($line -notmatch '^([^=]+)=(.*)$') { continue }
            $name, $value = $Matches[1], $Matches[2]
            if ($name -match '^(GITHUB_|RUNNER_)' -or $before[$name] -eq $value) { continue }
            if ($name -eq 'Path') { $added = @($value -split ';' | Where-Object { $_ -and ($before['Path'] -split ';') -notcontains $_ }); [array]::Reverse($added); $added | Out-File -Append -Encoding utf8 $env:GITHUB_PATH }
            else { "$name=$value" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV }
          }
      - name: Restore the Visual Studio cargo build (main's CI cache)
        if: startsWith(matrix.variant, 'vs-')
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/x64-deadlock-release/x64/Release/cargo
          key: cargo-${{ runner.os }}-${{ hashFiles('Lib/**/Cargo.toml', 'Lib/**/Cargo.lock', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Restore the Ninja cargo build
        if: ${{ !startsWith(matrix.variant, 'vs-') }}
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/x64-deadlock-ninja-release/cargo
          key: cargo-ninja-${{ runner.os }}-${{ hashFiles('Lib/**/Cargo.toml', 'Lib/**/Cargo.lock', 'Cargo.lock') }}
          restore-keys: cargo-ninja-${{ runner.os }}-
      - uses: actions/cache/restore@v4
        with:
          path: bench-shaders
          key: bench-shaders-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Seed the shader bundle
        run: |
          $bundle = "build\$env:PRESET\AfxHookSource2\Release\environment-shaders"
          New-Item -ItemType Directory -Force $bundle | Out-Null
          Copy-Item bench-shaders\* $bundle
      - name: Configure
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          cmake --preset $env:PRESET
          "::notice title=$env:VARIANT configure::$([int]$timer.Elapsed.TotalSeconds) s"
      - name: Build shaderbuilder first (Visual Studio only, as in CI)
        if: startsWith(matrix.variant, 'vs-')
        run: cmake --build --preset $env:PRESET --target shaderbuilder
      - name: Build
        run: &timed-build |
          $memory = Join-Path $env:RUNNER_TEMP "min-free-mb.txt"
          $monitor = Start-Job -ArgumentList $memory {
            param($file); $min = [int]::MaxValue
            while ($true) { $free = [int]((Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1024); if ($free -lt $min) { $min = $free; Set-Content $file $min }; Start-Sleep 3 }
          }
          if (Get-Command sccache -ErrorAction SilentlyContinue) { sccache --zero-stats | Out-Null }
          $jobs = switch -Regex ($env:VARIANT) { '^vs-m3' { 3 } 'j4' { 4 } 'j6' { 6 } 'j8' { 8 } default { 4 } }
          $timer = [Diagnostics.Stopwatch]::StartNew()
          cmake --build --preset $env:PRESET --parallel $jobs
          $code = $LASTEXITCODE
          $seconds = [int]$timer.Elapsed.TotalSeconds
          Stop-Job $monitor; Remove-Job $monitor -Force
          $cpu = (Get-CimInstance Win32_Processor | Select-Object -First 1).Name
          $line = "$env:VARIANT rep ${{ matrix.rep }}${{ matrix.scenario }}: build $seconds s, exit $code, min free RAM $(Get-Content $memory) MB, --parallel $jobs, $cpu"
          "::notice title=Benchmark::$line"
          "$line" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit $code
      - name: Compiler cache statistics
        if: ${{ !cancelled() && startsWith(matrix.variant, 'sccache') }}
        run: &sccache-stats |
          sccache --show-stats
          $stats = (sccache --show-stats --stats-format json | ConvertFrom-Json).stats
          $hits = [int]($stats.cache_hits.counts.PSObject.Properties | Measure-Object Value -Sum).Sum
          $misses = [int]($stats.cache_misses.counts.PSObject.Properties | Measure-Object Value -Sum).Sum
          $notCached = ($stats.not_cached.PSObject.Properties | ForEach-Object { "$($_.Name): $($_.Value)" }) -join '; '
          $size = [math]::Round(((Get-ChildItem -Recurse -File $env:SCCACHE_DIR | Measure-Object Length -Sum).Sum / 1MB))
          "::notice title=Compiler cache::$env:VARIANT ${{ matrix.scenario }}: $hits hits, $misses misses, $($stats.cache_writes) writes, $($stats.requests_not_cacheable) not cacheable ($notCached), cache dir $size MB"
          sccache --stop-server | Out-Null
      - name: Save the compiler cache for the warm runs
        if: startsWith(matrix.variant, 'sccache')
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/sccache
          key: bench-sccache-${{ github.run_id }}
      - name: Native tests
        run: ctest --test-dir build/$env:PRESET -C Release --timeout 300 --parallel 4 -E "^(EnvironmentAtmosphereEdgeTests|EnvironmentRenderTests|RelightProbeGpuTests|EnvironmentVolumeCacheTests)$"

  # Rebuilds from the cold run's compiler cache: unchanged sources, one edited .cpp, and one edited
  # header that 31 hook sources include.
  warm:
    needs: bench
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scenario: [unchanged, unchanged-again, one-cpp, shared-header]
    env:
      VARIANT: sccache-warm-j4
      PRESET: x64-deadlock-ninja-release
    steps:
      - name: Enable long paths
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
      - name: Update submodules
        run: git submodule update --init --recursive
      - name: Install sccache
        run: *install-sccache
      - name: Enter the Visual Studio x64 developer environment
        run: *vs-env
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/x64-deadlock-ninja-release/cargo
          key: cargo-ninja-${{ runner.os }}-${{ hashFiles('Lib/**/Cargo.toml', 'Lib/**/Cargo.lock', 'Cargo.lock') }}
          restore-keys: cargo-ninja-${{ runner.os }}-
      - uses: actions/cache/restore@v4
        with:
          path: bench-shaders
          key: bench-shaders-${{ github.run_id }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sccache
          key: bench-sccache-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Seed the shader bundle
        run: |
          $bundle = "build\$env:PRESET\AfxHookSource2\Release\environment-shaders"
          New-Item -ItemType Directory -Force $bundle | Out-Null
          Copy-Item bench-shaders\* $bundle
      - name: Edit a source for the scenario
        run: |
          $edit = "`r`nnamespace { [[maybe_unused]] constexpr int kCiBenchmarkEdit = 1; }`r`n"
          switch ("${{ matrix.scenario }}") {
            'one-cpp' { Add-Content AfxHookSource2/Filmmaker/Environment/EnvironmentShadowMaps.cpp $edit -NoNewline }
            'shared-header' { Add-Content AfxHookSource2/Filmmaker/Filmmaker.h $edit -NoNewline }
          }
          git status --short
      - name: Configure
        run: cmake --preset $env:PRESET
      - name: Build
        run: *timed-build
      - name: Compiler cache statistics
        if: ${{ !cancelled() }}
        run: *sccache-stats

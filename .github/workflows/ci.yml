name: CI

# Checks for pull requests into main and release/*, and for pushes to those branches. Branch
# protection should require only `ci-gate`, because it fails when any job it aggregates fails.
# A green CI run does not prove that an in-game feature works. See Docs/setup/git-workflow.md.

on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main, "release/**"]
  merge_group:

permissions:
  contents: read

jobs:
  docs-integrity:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
      - name: Documentation integrity
        run: node --test Automation/tests/documentation-integrity-tests.mjs

  panorama-tests:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
      - name: Panorama interaction and layout tests
        run: node --test Automation/tests/panorama-interaction-layout-tests.mjs

  launcher-build:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: SourceMovieMakerLauncher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: SourceMovieMakerLauncher/package-lock.json
      - name: Install launcher dependencies
        run: npm ci
      - name: Typecheck launcher renderer
        run: npm run check:renderer
      - name: Build launcher renderer
        run: npm run build:renderer

  # The native build is the slow job, so it only runs when something it compiles changed. A job
  # skipped this way counts as passing for `ci-gate`. Pushes and merge groups always build.
  changes:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.detect.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          native=true
          if [ "$EVENT" = "pull_request" ]; then
            native=false
            pattern='^(AfxHookSource2|Lib|CMake|Deps|Shared|Shaders|ShaderBuilder|FilmmakerDemo[A-Za-z]*Go|Misc|Resources)/|^Automation/tests/.*\.(cpp|h|hpp)$|^(CMakeLists\.txt|CMakePresets\.json|\.gitmodules)$|^\.github/workflows/ci\.yml$'
            if git diff --name-only "$BASE" "$HEAD" | grep -Eq "$pattern"; then native=true; fi
          fi
          echo "native=$native" >> "$GITHUB_OUTPUT"

  # The CS2 hook and its native tests. The inherited HLAE multi-build (Source 1, GoldSrc, win32)
  # lives in legacy-native.yml and runs nightly instead of on every pull request.
  native-build-windows:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-2022
    steps:
      # Some osu! easter-egg asset paths exceed Windows' 260-character limit.
      - name: Enable long paths
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Cache cargo registry and the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/x64-source2-release/x64/Release/cargo
          key: cargo-${{ runner.os }}-${{ hashFiles('Lib/**/Cargo.toml', 'Lib/**/Cargo.lock', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: CMake - Configure CS2 hook
        run: cmake --preset x64-source2-release
      - name: CMake - Build CS2 hook and native tests
        run: cmake --build --preset x64-source2-release --parallel
      # The four D3D11 render fixtures take 17 s to 8 minutes on a real GPU and have no GPU here, so
      # they stay local checks (ctest on a dev machine) and in-game verification.
      - name: Native tests
        run: >-
          ctest --test-dir build/x64-source2-release -C Release --output-on-failure --timeout 300 --parallel 4
          -E "^(EnvironmentAtmosphereEdgeTests|EnvironmentRenderTests|RelightProbeGpuTests|EnvironmentVolumeCacheTests)$"

  security-license-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Scan tracked files for secrets, private paths, and forbidden files
        run: node Automation/verify/check-repo-policy.mjs --scan

  changed-file-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check added and modified files
        run: >-
          node Automation/verify/check-repo-policy.mjs --changed
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  ci-gate:
    if: always()
    needs:
      - changes
      - docs-integrity
      - panorama-tests
      - launcher-build
      - native-build-windows
      - security-license-scan
      - changed-file-policy
    runs-on: ubuntu-latest
    steps:
      - name: Fail when any aggregated job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "At least one aggregated job failed or was cancelled."
          exit 1

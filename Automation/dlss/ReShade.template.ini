; SOURCE:MVM authoritative ReShade config for the DLSS 5 neural-rendering setup.
;
; Generated into game/bin/win64/ReShade.ini by Automation/dlss/install-dlss.ps1.
; Placeholders for the bin directory, addon filename and temp path are filled in at install time.
;
; Do NOT hand-edit the deployed copy: ReShade rewrites its ini on process exit, so a live
; edit is silently clobbered. Edit THIS template and re-run the installer with CS2 closed.

[ADDON]
DisabledAddons=
; Loaded from DllMain so the addon's NGX hooks are installed before anything calls NGX, and so
; ReShade's logical unload on device recreation does not drop it. The addon also lives in the
; scan directory (bin\win64), which is the fallback if this path is ever wrong.
LoadFromDllMain={{BINDIR}}\{{ADDON}}

[DEPTH]
; Required by the depth-reading Lumenite effects (RTAO, LSAO, SSSR, TRAA, QuantAO). A runtime
; whose config lacks this section renders them with no depth buffer, which reads as
; "ReShade stopped working".
DepthCopyBeforeClears=0

[GENERAL]
EffectSearchPaths=.\reshade-shaders\Shaders\**
IntermediateCachePath={{TEMP}}\ReShade
NoDebugInfo=1
NoEffectCache=0
NoReloadOnInit=0
PerformanceMode=0
PreprocessorDefinitions=RESHADE_DEPTH_LINEARIZATION_FAR_PLANE=255,RESHADE_DEPTH_INPUT_IS_UPSIDE_DOWN=0,RESHADE_DEPTH_INPUT_IS_REVERSED=0,RESHADE_DEPTH_INPUT_IS_LOGARITHMIC=0
PresetPath=.\ReShadePreset.ini
SkipLoadingDisabledEffects=0
TextureSearchPaths=.\reshade-shaders\Textures\**

[INPUT]
; KeyOverlay is read by AfxHookSource2/UiInputGate.cpp as the fallback overlay-state signal
; when mvm_reshade_state.addon64 is not loaded. 36 = VK_HOME (ReShade's default).
ForceShortcutModifiers=1
GamepadNavigation=0
InputProcessing=2
KeyOverlay=36,0,0,0
KeyScreenshot=44,0,0,0

[OVERLAY]
AutoSavePreset=1
ShowFPS=2
TutorialProgress=4

[SCREENSHOT]
ClearAlpha=1
FileFormat=1
FileNaming=%AppName% %Date% %Time%_%Count%
JPEGQuality=90
SavePath=.\

[STYLE]
FontScale=1.500000
StyleIndex=2

; ---------------------------------------------------------------------------------------------
; RenoDX DLSS (renodx-dlss.addon64) -- the STANDALONE configuration.
;
; CS2 has no native DLSS. The supplied September build uses Present (3)
; and Require DLSS Off, as specified in its readme.
; Restart the game after changing the hook method.
[RENODX-DLSS]
DirectNeuralRenderingEnabled=1
DirectNeuralRenderingHookPoint=3
DirectNeuralRenderingRequireDlss=0
DirectNeuralRenderingAutoMask=1
DirectNeuralRenderingIntensity=1
DirectNeuralRenderingGlobalToneStrength=1
DirectNeuralRenderingLocalToneStrength=1
DirectNeuralRenderingLocalStructureStrength=1
DirectNeuralRenderingSkinStructureStrength=1
DirectNeuralRenderingStyle=0
DirectNeuralRenderingEncoding=0
DirectNeuralRenderingUiCorrectionMode=1
DirectNeuralRenderingDiffuseWhiteOverride=1
DirectNeuralRenderingDiffuseWhiteNits=252
DLSSPath=nvngx_dlss.dll
StreamlinePath=sl.interposer.dll

; Settings for the other build (renodx-dlss5.addon64, "RenoDX DLSS5 Generic"). Seeded with the
; values already tuned in this install so switching addons does not silently reset them.
[RenoDX.DLSS5]
NeuralUplift=1
NRAutoMask=1
NRColorStrength=0.31
NRDepthMode=0
NREnableUpscaling=1
NRIntensity=0.99
NRLocalStructure=0
NRLocalTone=0
NRMVecScaleX=-0.083
NRMVecScaleY=-0.292
NRPaperWhiteScale=3.871
NRPreset=0
NRSkinStructure=0.44
NRStyle=1
NRToggleKey=117
NRTransferStrength=0.2
NRUICorrection=1
